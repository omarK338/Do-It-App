<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Do It App</title>
    <link rel="stylesheet" href="Login.WPCS22.css">
    <link rel="icon" href="Icon.jpg" type="image/x-icon">
</head>
<body>
    <div class="container">
        <div class="left-section">
            <h1>Do It App</h1>
            <p>Organize your life, achieve your goals, and collaborate with your team.</p>
        </div>

        <div class="auth-container">
            <!-- Login Form -->
            <div id="login-form" class="form-section">
                <form id="login">
                    <input type="text" id="login-username" placeholder="Username or Email" required><p></p>
                    <input type="password" id="login-password" placeholder="Password" required><p></p>
                    <button type="submit" class="btn-primary">Login</button>
                    <button onclick="showForm('register')">Create New Account</button>
                    <div id="login-error" class="error-message"></div>
                </form>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="form-section" style="display: none;">
                <form id="register">
                    <input type="text" id="register-username" placeholder="Username" required>
                    <input type="email" id="register-email" placeholder="Email" required>
                    <input type="password" id="register-password" placeholder="Password (min 8 characters)" minlength="8" required>
                    <div class="security-questions">
                        <input type="text" id="security-question1" placeholder="Security Question 1" required>
                        <input type="text" id="security-answer1" placeholder="Answer" required>
                        <input type="text" id="security-question2" placeholder="Security Question 2" required>
                        <input type="text" id="security-answer2" placeholder="Answer" required>
                        <input type="text" id="security-question3" placeholder="Security Question 3" required>
                        <input type="text" id="security-answer3" placeholder="Answer" required>
                    </div>
                    <button type="submit" class="btn-primary">Register</button>
                    <button onclick="showForm('login')">Already have an account?</button>
                    
                </form>
            </div>

            <!-- Recovery Form -->
            <div id="recovery-form" class="form-section" style="display: none;">
                <input type="hidden" id="recovery-username">
                <div id="security-questions-div" style="display: none;">
                    <label>Question 1: <span id="question1-text"></span></label>
                    <input type="text" id="security-answer1-input" required>
                    <label>Question 2: <span id="question2-text"></span></label>
                    <input type="text" id="security-answer2-input" required>
                    <label>Question 3: <span id="question3-text"></span></label>
                    <input type="text" id="security-answer3-input" required><p></p>
                    <button type="button" class="btn-primary" onclick="verifySecurityAnswers()">Verify Answers</button>
                    <button type="button" class="btn-primary" onclick="verifySecurityAnswers()">Forgot Password</button>
                </div>
                <div id="recovery-error" class="error-message"></div>
                
                <a href="#" class="recovery-link" onclick="showForm('login')">Back to Login</a>
            </div>
        </div>
    </div>
    <script src="Login.WPCS22.js"></script>
</body>
</html>
