<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - Do It App</title>
    <link rel="stylesheet" href="Tasks.WPCS22.css">
    <link rel="icon" href="../Icon.jpg" type="image/x-icon">
</head>
<body>
    <header>
        <h1>My Tasks</h1>
        <nav>
            <ul>
                <li><a href="../Home.WPCS22.html">Home</a></li>
                <li><a href="../Dailies.WPCS22/Dailies.WPCS22.html">Dailies</a></li>
                <li><a href="../Export.WPCS22/Export.WPCS22.html">Export</a></li>
                <li><a href="../Profile.WPCS22/Profile.WPCS22.html">Profile</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="task-form">
            <label for="task-title">Task Title:</label>
            <input type="text" id="task-title" name="title" required>
            <label for="task-priority">Task Priority:</label>
            <input type="text" id="task-priority" name="priority">
            <label for="reminder-datetime">Reminder Date/Time:</label>
            <input type="datetime-local" id="reminder-datetime" name="reminder">
            <label for="task-notes">Task Notes:</label>
            <textarea id="task-notes" name="notes"></textarea>
            <label for="attach-media">Attach Media (Image/Video/Audio, max 50 MB):</label>
            <button type="button" onclick="attachMediaToTask()" class="drive-btn">
                Attach Media (Google Drive)
            </button>
            <input type="hidden" id="hidden-drive-id">
            <input type="hidden" id="hidden-drive-email">
            <div id="media-preview-container"></div>
            <label for="reminder-sound">Reminder Sound:</label>
            <select id="reminder-sound" name="sound"></select>
            <button id="attach-sound-btn" style="display: none;" onclick="attachSoundToTask()">Attach Custom Sound (Google Drive)</button>
            <input type="hidden" id="hidden-sound-drive-id">
            <input type="hidden" id="hidden-sound-drive-email">
            <div id="sound-preview-container"></div>
            <div style="grid-column: span 2; display: flex; gap: 10px;">
                <button onclick="saveTask()" id="save-task">Add Task</button>
                <button onclick="cancelTask()" style="background-color: #64748b;">Cancel</button>
                <button id="add-new-task" style="display: none; background-color: #10b981;" onclick="resetTaskForm()">Add New Task</button>
            </div>
        </div>
        
        <!-- Right-Click Context Menu -->
        <div id="context-menu" class="context-menu">
            <ul>
                <li onclick="viewSelectedTask()">📄 View Task</li>
                <li onclick="previewSelectedMedia()">🎬 Preview Media</li>
                <li onclick="editSelectedTask()">✏️ Edit</li>
                <li onclick="deleteSelectedTask()" class="delete-option">🗑️ Delete</li>
            </ul>
        </div>
        
        <!-- Media Modal -->
        <div id="media-modal" class="modal">
            <div class="modal-content">
                <span class="close-modal" onclick="closeMediaModal()">&times;</span>
                <div id="media-container"></div>
            </div>
        </div>
        
        <!-- View Task Modal -->
        <div id="view-task-modal" class="modal">
            <div class="modal-content view-task-content">
                <span class="close-modal" onclick="closeViewTaskModal()">&times;</span>
                <h2 id="view-task-title">Task Details</h2>
                <div class="view-task-form">
                    <div class="view-field">
                        <label>Task Name:</label>
                        <input type="text" id="view-task-name" readonly>
                    </div>
                    <div class="view-field">
                        <label>Priority:</label>
                        <input type="text" id="view-task-priority" readonly>
                    </div>
                    <div class="view-field">
                        <label>Reminder:</label>
                        <input type="text" id="view-task-reminder" readonly>
                    </div>
                    <div class="view-field">
                        <label>Notes:</label>
                        <textarea id="view-task-notes" readonly></textarea>
                    </div>
                    <div class="view-field">
                        <label>Status:</label>
                        <input type="text" id="view-task-status" readonly>
                    </div>
                    <div class="view-field">
                        <label>Time:</label>
                        <input type="text" id="view-task-time" readonly>
                    </div>
                    <div class="view-field">
                        <label>Task Media:</label>
                        <div id="view-task-media" class="view-media-container"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Reminder Modal -->
        <div id="reminder-modal" class="modal">
            <div class="modal-content">
                <h2>Reminder!</h2>
                <p id="reminder-title"></p>
                <p id="reminder-notes"></p>
                <button onclick="markAsDoneFromModal()">Mark as Done</button>
                <button onclick="closeReminderModal()">OK</button>
            </div>
        </div>
        
        <div class="task-table">
            <div class="action-bar">
                <button onclick="selectAll()">Select All</button>
                <button onclick="selectUpper10()">Select Upper 10</button>
                <button onclick="selectLower10()">Select Lower 10</button>
                <button onclick="editTask()">Edit</button>
                <button onclick="deleteTasks()">Delete</button>
                <input type="text" id="search-box" placeholder="Search tasks..." onkeyup="searchTasks()">
            </div>
            <table id="task-table">
                <thead>
                    <tr>
                        <th data-column="series" onclick="sortTable('series')">Series</th>
                        <th>Selector</th>
                        <th data-column="name" onclick="sortTable('name')">Name</th>
                        <th data-column="reminder" onclick="sortTable('reminder')">Reminder</th>
                        <th data-column="notes" onclick="sortTable('notes')">Notes</th>
                        <th>Media</th>
                        <th data-column="reminderSet" onclick="sortTable('reminderSet')">Reminder Set</th>
                        <th data-column="status" onclick="sortTable('status')">Status</th>
                        <th data-column="mark" onclick="sortTable('mark')">Mark</th>
                        <th data-column="time" onclick="sortTable('time')">Time</th>
                    </tr>
                </thead>
                <tbody id="task-table-body"></tbody>
            </table>
        </div>
    </main>
    <script src="Tasks.WPCS22.js"></script>
</body>
</html>
