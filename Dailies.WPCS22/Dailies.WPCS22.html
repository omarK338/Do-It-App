<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dailies - Do It App</title>
    <link rel="stylesheet" href="Dailies.WPCS22.css">
    <link rel="icon" href="../Icon.jpg" type="image/x-icon">
</head>
<body>
    <header>
        <h1>My Dailies</h1>
        <nav>
            <ul>
                <li><a href="../Home.WPCS22.html">Home</a></li>
                <li><a href="../Tasks.WPCS22/Tasks.WPCS22.html">Tasks</a></li>
                <li><a href="../Export.WPCS22/Export.WPCS22.html">Export</a></li>
                <li><a href="../Profile.WPCS22/Profile.WPCS22.html">Profile</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="daily-form">
            <label for="daily-title">Daily Title:</label>
            <input type="text" id="daily-title" name="title" required>
            <label for="daily-note">Daily Note:</label>
            <textarea id="daily-note" name="note"></textarea>
            <label for="daily-time">Time:</label>
            <input type="datetime-local" id="daily-time" name="time">
            <label for="daily-reminder">Reminder:</label>
            <input type="datetime-local" id="daily-reminder" name="reminder">
            <label for="daily-media">Attach Media (Image/Video/Audio, max 50 MB):</label>
            <button type="button" onclick="attachMediaToDaily()" class="drive-btn">
                Attach Media (Google Drive)
            </button>
            <input type="hidden" id="hidden-drive-id">
            <input type="hidden" id="hidden-drive-email">
            <input type="hidden" id="daily-media">
            <div style="grid-column: span 2; display: flex; gap: 10px;">
                <button onclick="saveDaily()" id="save-note">Save Note</button>
                <button onclick="cancelDaily()" style="background-color: #64748b;">Cancel</button>
                <button id="add-new-daily" style="display: none; background-color: #10b981;" onclick="resetDailyForm()">Add New Daily</button>
            </div>
        </div>
        
        <!-- Right-Click Context Menu -->
        <div id="context-menu" class="context-menu">
            <ul>
                <li onclick="viewSelectedDaily()">📄 View Daily</li>
                <li onclick="previewSelectedMedia()">🎬 Preview Media</li>
                <li onclick="editSelectedDaily()">✏️ Edit</li>
                <li onclick="deleteSelectedDaily()" class="delete-option">🗑️ Delete</li>
            </ul>
        </div>
        
        <!-- Media Modal -->
        <div id="media-modal" class="modal">
            <div class="modal-content">
                <span class="close-modal" onclick="closeMediaModal()">&times;</span>
                <div id="media-container"></div>
            </div>
        </div>
        
        <!-- View Daily Modal -->
        <div id="view-daily-modal" class="modal">
            <div class="modal-content view-daily-content">
                <span class="close-modal" onclick="closeViewDailyModal()">&times;</span>
                <h2 id="view-daily-title">Daily Details</h2>
                <div class="view-daily-form">
                    <div class="view-field">
                        <label>Daily Name:</label>
                        <input type="text" id="view-daily-name" readonly>
                    </div>
                    <div class="view-field">
                        <label>Daily Time:</label>
                        <input type="text" id="view-daily-time" readonly>
                    </div>
                    <div class="view-field">
                        <label>Daily Text:</label>
                        <textarea id="view-daily-text" readonly></textarea>
                    </div>
                    <div class="view-field">
                        <label>Reminder:</label>
                        <input type="text" id="view-daily-reminder" readonly>
                    </div>
                    <div class="view-field">
                        <label>Daily Media:</label>
                        <div id="view-daily-media" class="view-media-container"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="daily-table">
            <div class="action-bar">
                <button onclick="selectAll()">Select All</button>
                <button onclick="selectUpper10()">Select Upper 10</button>
                <button onclick="selectLower10()">Select Lower 10</button>
                <button onclick="editDaily()">Edit</button>
                <button onclick="deleteDailies()">Delete</button>
                <input type="text" id="search-box" placeholder="Search dailies..." onkeyup="searchDailies()">
            </div>
            <table id="daily-table">
                <thead>
                    <tr>
                        <th onclick="sortTable('series')">Series</th>
                        <th>Selector</th>
                        <th onclick="sortTable('title')">Name</th>
                        <th onclick="sortTable('time')">Time</th>
                        <th onclick="sortTable('note')">Content</th>
                        <th>Media</th>
                        <th onclick="sortTable('reminder')">Reminder</th>
                    </tr>
                </thead>
                <tbody id="daily-table-body"></tbody>
            </table>
        </div>
    </main>
    <script src="Dailies.WPCS22.js"></script>
</body>
</html>
